gui:
  showCommandLog: false
  # Ristretto Light: default terminal green is too close to the cream
  # background / body text. Use the theme's olive focus ring instead.
  theme:
    activeBorderColor:
      - "#496c1e"
      - bold
    searchingActiveBorderColor:
      - "#8a6c3e"
      - bold
    optionsTextColor:
      - "#496c1e"
    selectedLineBgColor:
      - "#e8dcc8"

# Let Homebrew handle updates
update:
  method: never 

git:
  # Don't automatically fetch because this prompts me to unlock
  # my 1password vault all the time. I'll do it manually.
  autoFetch: false

services:
  "github.com": "github:github.com"
