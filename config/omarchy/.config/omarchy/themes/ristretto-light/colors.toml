# Overlay for https://github.com/brokkoli71/omarchy-ristretto-light-theme
# Only this file is tracked; the rest of the theme stays in
# ~/.config/omarchy/themes/ristretto-light from `omarchy theme install`.

# Accent and UI colors
accent = "#85b34c"
active_border_color = "#496c1e"
active_tab_background = "#85b34c"

# Cursor colors
cursor = "#22211d"

# Primary colors
foreground = "#22211d"
background = "#fdf6ee"

# Selection colors
selection_foreground = "#fdf6ee"
selection_background = "#85b34c"

# Normal colors (ANSI 0-7)
color0 = "#7a6550"
color1 = "#df2b0d"
# Was #29472a — same value as the foreground, so lazygit "green"
# (staged files, +diffs, active border) vanished into the cream.
color2 = "#496c1e"
color3 = "#8a6c3e"
color4 = "#5e8e28"
color5 = "#28473f"
color6 = "#3d6b52"
color7 = "#24201d"

# Bright colors (ANSI 8-15)
color8 = "#a09080"
color9 = "#e03c20"
color10 = "#3d5f12"
color11 = "#6b5237"
color12 = "#496c1e"
color13 = "#28463c"
color14 = "#4a6b4d"
color15 = "#22211d"
