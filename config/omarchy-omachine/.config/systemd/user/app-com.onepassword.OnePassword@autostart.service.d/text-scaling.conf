# 1Password rewrites ~/.config/autostart/com.onepassword.OnePassword.desktop
# on every launch, stripping flags. The generated unit is
# app-com.onepassword.OnePassword@autostart.service — not app-1password@.
# Electron reads GNOME text-scaling-factor and multiplies it into device
# scale; fixed-size unlock/CLI dialogs then clip. See omarchy#8574.
[Service]
Environment=GSETTINGS_BACKEND=memory
Environment=GDK_SCALE=1
ExecStart=
ExecStart=%h/.local/bin/1password-launch --silent
