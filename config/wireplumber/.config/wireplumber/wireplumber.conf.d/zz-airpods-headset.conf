## Omarchy auto-connects only A2DP on every Bluetooth card, which is
## right for speakers and wrong for AirPods in meetings: the mic lives
## on HFP, so the headset profile is created on demand and then flaps.
## This file sorts after bluetooth-a2dp-autoconnect.conf and overrides
## that list for Apple headphones.
##
## session.suspend-timeout-seconds = 0 keeps the SCO link up when you
## pause speaking, instead of letting PipeWire idle-suspend the mic.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
        device.nick = "~AirPods*"
      }
      {
        device.name = "~bluez_card.*"
        device.description = "~AirPods*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hfp_ag hsp_hs hsp_ag a2dp_sink a2dp_source bap_sink bap_source ]
        bluez5.hw-offload-sco = false
      }
    }
  }
  {
    matches = [
      {
        node.name = "~bluez_input.*"
      }
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
