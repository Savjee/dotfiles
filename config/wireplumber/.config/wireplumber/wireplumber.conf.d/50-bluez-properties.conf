## Bluetooth headset quality on the onboard MediaTek/Quectel adapter.
## mSBC is the wideband HFP codec meetings actually use; hardware SCO
## offload on this firmware drops packets (PipeWire logs it as a
## "Bluetooth adapter firmware bug").

monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.hfphsp-backend = "native"
  bluez5.hw-offload-sco = false
}
